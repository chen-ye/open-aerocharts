name: Update FAA PMTiles

on:
  schedule:
    # FAA updates run on a 28 day cycle, typically effective on Thursdays.
    # Running weekly on Thursdays at 10 AM UTC ensures we catch the new cycle when it drops.
    - cron: '0 10 * * 4'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-pmtiles:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version-file: "faa-ais-pmtiles/pyproject.toml"

      - name: Run datagen pipeline
        id: datagen
        run: |
          cd faa-ais-pmtiles
          uv run build-pmtiles

      - name: Create Pull Request
        if: steps.datagen.outputs.is_new == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore(data): update FAA PMTiles cycle ${{ steps.datagen.outputs.cycle }}"
          title: "Automated FAA Data Cycle Update - Cycle ${{ steps.datagen.outputs.cycle }}"
          body: |
            Automated pull request to update FAA aeronautical datasets to the latest 28-day cycle (${{ steps.datagen.outputs.cycle }}).

            The data pipeline has fetched the latest CIFP and generated new `.pmtiles`.
          branch: "chore/update-faa-data-${{ steps.datagen.outputs.cycle }}"
          base: "main"
          delete-branch: true
