[project]
name = "faa-ais-pmtiles"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "cifparse>=2.0.9",
    "geojson>=3.3.0",
    "geopandas>=1.2.0",
    "pyogrio>=0.13.0",
    "pyshp>=3.1.9",
    "requests>=2.34.2",
    "tippecanoe>=2.72.0",
]

[project.scripts]
fetch-cifp = "src.cifp.fetch:main"
cifp-to-fgb = "src.cifp.convert:main"
fetch-airspace-shp = "src.adds.fetch:main"
shp-to-fgb = "src.adds.convert:main"
build-pmtiles = "src.pmtiles.build:main"
build-search-index = "src.search.build_index:main"
fetch-vfr = "src.vfr.fetch:main"
spot-check = "src.tools.spot_check:main"
list-enums = "src.tools.enums:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 140
target-version = "py315"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[dependency-groups]
dev = [
    "ruff>=0.17.6",
]
